<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero Banner B — Phone + floating UI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; background: transparent; }

  #panel {
    position: relative;
    width: 1440px; height: 640px;
    background: #F5F0EB;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(0,0,0,.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }
  /* warm amber glow — matches background warmth */
  .glow {
    position: absolute; pointer-events: none;
    width: 560px; height: 560px;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(ellipse, rgba(219,143,67,.13) 0%, transparent 68%);
  }

  /* phone */
  #phone-pos {
    position: absolute;
    left: 581px; top: 26px;
    z-index: 3;
  }
  #phone-scale { transform: scale(0.68); transform-origin: top left; }
  .phone-bezel {
    width: 410px; height: 864px;
    border-radius: 44px; background: #14181F; padding: 10px;
    box-shadow: 0 28px 64px rgba(20,28,40,.24), 0 6px 18px rgba(20,28,40,.14),
                inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .phone-screen {
    width: 390px; height: 844px; border-radius: 34px;
    background: url('screens/day-kauai.png') center top / 390px 844px no-repeat, #14181F;
  }

  /* floating cards */
  .float {
    position: absolute; transform-origin: center center;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,.14)) drop-shadow(0 2px 6px rgba(0,0,0,.08));
  }
  .card { background: #fff; border: 1px solid rgba(0,0,0,.05); box-shadow: 0 6px 18px rgba(40,50,70,.08); }
  .cap  { font: 600 13px/16px var(--font); text-transform: uppercase; letter-spacing: .05em; }

  /* product label */
  .banner-label {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font: 600 12px/16px var(--font); letter-spacing: .12em; text-transform: uppercase;
    color: rgba(0,0,0,.26); white-space: nowrap; z-index: 1;
  }
</style>
</head>
<body>
<div id="panel">
  <div class="grid"></div>
  <div class="glow"></div>
  <div id="phone-pos"><div id="phone-scale">
    <div class="phone-bezel"><div class="phone-screen"></div></div>
  </div></div>
  <div id="floats"></div>
  <div class="banner-label">Travel Day Organizer</div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const ICONS = {
  beach:   '<path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
  clock:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  chev:    '<path d="m9 18 6-6-6-6"/>',
  arrow:   '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  mappin:  '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  sunrise: '<path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>',
  plane:   '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19 2c-2-2-4-2-5.5-.5L10 5 1.8 6.2a1 1 0 0 0-.7 1.5L4 11l3.5 2 2-3.5 3 3-3.5 2 2 3.5a1 1 0 0 0 1.5-.7z"/>',
};
function svgEl(name, size, color, sw) {
  const s = document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width',size); s.setAttribute('height',size);
  s.setAttribute('fill','none'); s.setAttribute('stroke',color); s.setAttribute('stroke-width',sw||2);
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
  s.innerHTML = ICONS[name]; return s;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const W = 358;

/* ── card builders ─────────────────────────────────────────────── */

function eventCard() {
  const c = el('div','card');
  Object.assign(c.style,{ width:W+'px', borderRadius:'16px', overflow:'hidden', position:'relative' });
  c.innerHTML = `<div style="position:relative;height:110px;background:linear-gradient(135deg,#0891B2,#67E8F9)">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=760&h=300&fit=crop&auto=format" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"/>
    <div style="position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(to top,rgba(0,0,0,.5),transparent)"></div>
  </div>
  <div class="ec" style="padding:10px 14px;display:flex;align-items:center;gap:10px">
    <div style="flex:1;min-width:0">
      <p style="font:600 18px/24px var(--font);color:#1A1A1A">Poipu Beach Afternoon</p>
      <p style="margin-top:2px;font:500 15px/20px var(--font);color:#6B6B6B">3:00 PM · Beach</p>
    </div>
  </div>`;
  const badge = el('div');
  Object.assign(badge.style,{ position:'absolute', top:'74px', left:'8px',
    display:'flex', alignItems:'center', gap:'5px', background:'rgba(0,0,0,.58)',
    backdropFilter:'blur(8px)', padding:'4px 10px', borderRadius:'8px' });
  badge.appendChild(svgEl('beach',13,'#fff',2.5));
  badge.appendChild(el('span',null,'<span style="font:600 13px var(--font);color:#fff">Beach</span>'));
  c.appendChild(badge);
  const det = el('div');
  Object.assign(det.style,{ height:'32px', padding:'0 10px 0 12px', borderRadius:'8px',
    background:'rgba(14,116,144,.12)', display:'inline-flex', alignItems:'center', gap:'4px',
    font:'600 13px var(--font)', color:'#0E7490', flexShrink:'0' });
  det.append('Details'); det.appendChild(svgEl('chev',14,'#0E7490',2.5));
  c.querySelector('.ec').appendChild(det);
  return c;
}

function dayHeader() {
  const c = el('div');
  Object.assign(c.style,{ width:W+'px', borderRadius:'16px', background:'#F9F0E6',
    padding:'14px 20px', textAlign:'center', boxShadow:'0 4px 14px rgba(40,50,70,.08)' });
  c.appendChild(el('p','cap','<span style="color:#6B6B6B;letter-spacing:.08em">Day 1 of 9</span>'));
  const h = el('h2',null,'Saturday, July 4');
  Object.assign(h.style,{ margin:'4px 0 0', font:'700 24px/30px var(--font)', color:'#1A1A1A' });
  c.appendChild(h);
  const route = el('p');
  Object.assign(route.style,{ margin:'4px 0 0', display:'inline-flex',
    alignItems:'center', gap:'6px', font:'500 15px/20px var(--font)', color:'#6B6B6B' });
  route.append('Chicago'); route.appendChild(svgEl('arrow',13,'#9B9B9B',2)); route.append('Kauai');
  c.appendChild(route);
  return c;
}

/* Destination card — full-bleed Kauai photo */
function destCard() {
  const c = el('div');
  Object.assign(c.style,{ width:W+'px', borderRadius:'16px', overflow:'hidden',
    position:'relative', height:'190px', boxShadow:'0 6px 18px rgba(40,50,70,.10)' });
  const photo = el('div');
  Object.assign(photo.style,{
    position:'absolute', inset:'0',
    backgroundImage:"url('https://images.unsplash.com/photo-1568805936-46d1ef2fc519?w=760&h=500&fit=crop&auto=format')",
    backgroundSize:'cover', backgroundPosition:'center top'
  });
  const overlay = el('div');
  Object.assign(overlay.style,{
    position:'absolute', inset:'0',
    background:'linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.68) 100%)'
  });
  const bar = el('div');
  Object.assign(bar.style,{ position:'absolute', top:'0', left:'0', right:'0', height:'4px', background:'#DB8F43' });
  const foot = el('div');
  Object.assign(foot.style,{ position:'absolute', bottom:'0', left:'0', right:'0', padding:'14px 16px' });
  const name = el('h2'); name.textContent = 'Kauai';
  Object.assign(name.style,{ font:'700 24px/30px var(--font)', color:'#fff', margin:'0 0 5px' });
  const meta = el('div');
  Object.assign(meta.style,{ display:'flex', alignItems:'center', gap:'7px' });
  const dot = el('div');
  Object.assign(dot.style,{ width:'8px', height:'8px', borderRadius:'50%', background:'#DB8F43', flexShrink:'0' });
  const sub = el('span'); sub.textContent = 'July 4 – 8 · 4 Days';
  Object.assign(sub.style,{ font:'500 15px/20px var(--font)', color:'rgba(255,255,255,.82)' });
  meta.append(dot, sub);
  foot.append(name, meta);
  c.append(photo, overlay, bar, foot);
  return c;
}

/* Flight card — ORD → LIH */
function flightCard() {
  const c = el('div','card');
  Object.assign(c.style,{ width:W+'px', borderRadius:'16px', overflow:'hidden' });
  // header
  const hdr = el('div');
  Object.assign(hdr.style,{ padding:'12px 16px', display:'flex', alignItems:'center', gap:'10px',
    borderBottom:'1px solid rgba(0,0,0,.06)' });
  const tile = el('div');
  Object.assign(tile.style,{ width:'32px', height:'32px', borderRadius:'8px', background:'#2AA5CB',
    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:'0' });
  tile.appendChild(svgEl('plane',16,'#fff',2));
  const info = el('div'); info.style.flex='1';
  info.innerHTML=`<p style="font:600 16px/22px var(--font);color:#1A1A1A">Departure Flight</p>
    <p style="font:500 13px/18px var(--font);color:#6B6B6B">United · UA 1947</p>`;
  const pill = el('div');
  Object.assign(pill.style,{ background:'rgba(39,129,91,.12)', borderRadius:'6px', padding:'3px 9px',
    font:'600 12px var(--font)', color:'#27815B', whiteSpace:'nowrap' });
  pill.textContent = 'On Time';
  hdr.append(tile, info, pill);
  c.appendChild(hdr);
  // route
  const route = el('div');
  Object.assign(route.style,{ padding:'14px 16px', display:'flex', alignItems:'center' });
  function port(code, city, time) {
    const d = el('div');
    d.innerHTML=`<p style="font:700 22px/28px var(--font);color:#1A1A1A">${code}</p>
      <p style="font:500 13px/18px var(--font);color:#6B6B6B">${city}</p>
      <p style="font:600 15px/20px var(--font);color:#1A1A1A;margin-top:4px">${time}</p>`;
    return d;
  }
  const mid = el('div');
  Object.assign(mid.style,{ flex:'1', textAlign:'center', padding:'0 8px' });
  mid.appendChild(svgEl('arrow',20,'#D0C8BF',1.5));
  const dur = el('p'); dur.textContent = '9h 30m';
  Object.assign(dur.style,{ font:'500 12px var(--font)', color:'#9B9B9B', marginTop:'2px' });
  mid.appendChild(dur);
  route.append(port('ORD','Chicago','8:15 AM'), mid, port('LIH','Kauai','1:45 PM'));
  c.appendChild(route);
  return c;
}

/* ── placement
   Phone x:581–860, y:26–613, z:3.
   Left cards tuck under phone's left edge; right cards tuck under phone's right edge. */
const floats = document.getElementById('floats');
const PLACEMENTS = [
  // left side — right edges slide ~10-20px under phone's left edge
  { make: dayHeader,  left: 300, top:  32, rotate: -7, scale: 0.80, z: 2 },
  { make: eventCard,  left: 308, top: 278, rotate:  6, scale: 0.80, z: 2 },
  // right side — left edges slide ~20-30px under phone's right edge
  { make: destCard,   left: 830, top:  80, rotate:  7, scale: 0.80, z: 2 },
  { make: flightCard, left: 844, top: 392, rotate: -5, scale: 0.80, z: 2 },
];
for (const p of PLACEMENTS) {
  const wrap = el('div','float');
  Object.assign(wrap.style,{ position:'absolute', top:p.top+'px', left:p.left+'px',
    transform:`rotate(${p.rotate}deg) scale(${p.scale})`,
    transformOrigin:'center center', zIndex:p.z });
  wrap.appendChild(p.make());
  floats.appendChild(wrap);
}

window.__ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
