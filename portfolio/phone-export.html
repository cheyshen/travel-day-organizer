<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Phone export – Day view</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { padding: 40px; display: inline-block; }

  .phone {
    width: 348px;
    padding: 14px;
    background: #14181F;
    border-radius: 46px;
    box-shadow:
      0 30px 70px rgba(20,28,40,0.28),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }

  /* Screen wrapper: clips content to rounded corners */
  .screen {
    position: relative;
    border-radius: 32px;
    overflow: hidden;
  }

  .screen > img {
    width: 100%;
    display: block;
  }

  /* ---- Status bar overlay ---- */
  /* Sits at the very top of the screen, vertically aligned with the dynamic island.
     Soft dark scrim ensures white text reads on any island-tinted header color. */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0%,
      rgba(0,0,0,0.00) 100%);
    pointer-events: none;
  }

  .time {
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.4px;
    line-height: 1;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .battery-pct {
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.2px;
    line-height: 1;
  }

  /* ---- Dynamic island ---- */
  /* Vertically centered in the 52px status-bar zone: (52 − 28) / 2 = 12px top */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 88px;
    height: 28px;
    background: #14181F;
    border-radius: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <img src="screens/day-export.png" alt="Day timeline" />

      <!-- Status bar: time | [dynamic island gap] | signal + wifi + battery -->
      <div class="status-bar">
        <span class="time">9:41</span>

        <div class="status-icons">
          <!-- Cell signal: 4 bars — first 3 filled, last faded = strong signal -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="white" xmlns="http://www.w3.org/2000/svg">
            <rect x="0"    y="8"   width="3"   height="4"  rx="0.9"/>
            <rect x="4.5"  y="5.5" width="3"   height="6.5" rx="0.9"/>
            <rect x="9"    y="3"   width="3"   height="9"  rx="0.9"/>
            <rect x="13.5" y="0.5" width="3"   height="11.5" rx="0.9" opacity="0.28"/>
          </svg>

          <!-- WiFi: dot + 2 arcs -->
          <svg width="15" height="12" viewBox="0 0 15 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7.5" cy="10.8" r="1.3" fill="white"/>
            <path d="M4.6 7.4C5.5 6.4 6.5 5.9 7.5 5.9s2 .5 2.9 1.5"
                  stroke="white" stroke-width="1.45" stroke-linecap="round"/>
            <path d="M1.8 4.7C3.3 3 5.3 2 7.5 2s4.2 1 5.7 2.7"
                  stroke="white" stroke-width="1.45" stroke-linecap="round" opacity="0.5"/>
          </svg>

          <!-- Battery: casing outline + fill (~85%) + nub -->
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- casing -->
            <rect x="0.5" y="0.5" width="20" height="11" rx="3.2" stroke="white" stroke-opacity="0.45"/>
            <!-- fill: ~85% of inner width (20-2 borders = 18px inner, 85%=15.3 → use 15) -->
            <rect x="2" y="2" width="15" height="8" rx="1.8" fill="white"/>
            <!-- nub -->
            <path d="M22 4v4a2 2 0 0 0 0-4Z" fill="white" fill-opacity="0.38"/>
          </svg>

          <span class="battery-pct">87%</span>
        </div>
      </div>

      <!-- Dynamic island: camera + Face ID pill, centered in the status bar zone -->
      <div class="dynamic-island"></div>
    </div>
  </div>
</body>
</html>
