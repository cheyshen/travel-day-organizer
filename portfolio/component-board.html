<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Travel — Component board</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; background: transparent; }

  /* the exported artifact: card-level components arranged loosely on the dark
     panel (no labels — the companion piece to the annotated callouts panel).
     Full-bleed: no rounded corners (user request). */
  #panel { width: 1920px; height: 1080px; background: var(--panel-bg, #1F2937);
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .board { display: flex; gap: 84px; align-items: center; transform: scale(1.35); }
  .bcol { display: flex; flex-direction: column; gap: 36px; }

  /* card primitives (mirroring src tokens: cleanCard, radius, type ramp) */
  .card { background: #FFFFFF; border: 1px solid rgba(0,0,0,.05);
          box-shadow: 0 6px 18px rgba(40,50,70,.12); }
</style>
</head>
<body>
  <div id="panel"><div class="board" id="board"></div></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const ICONS = {
  beach: '<path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
};
function svg(name, size, color, sw) {
  const s = document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width',size); s.setAttribute('height',size);
  s.setAttribute('fill','none'); s.setAttribute('stroke',color); s.setAttribute('stroke-width',sw||2);
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.innerHTML = ICONS[name]; return s;
}
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html!=null) e.innerHTML = html; return e; }

/* components — mirrored from src (see components.html, corrected 2026-06-28) -- */
function destCard() {
  const c = el('div'); Object.assign(c.style,{ width:'320px', height:'160px', borderRadius:'18px',
    overflow:'hidden', position:'relative', background:'linear-gradient(135deg,#0A8F8F,#064e4e)',
    boxShadow:'0 10px 28px rgba(0,0,0,.35)' });
  c.innerHTML =
    `<div style="position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1505852679233-d9fd70aff56d?w=640&q=80&auto=format&fit=crop');background-size:cover;background-position:center"></div>
     <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%)"></div>
     <div id="ov" style="position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
       <div style="min-width:0">
         <h3 style="margin:0;font:700 30px/36px var(--font);color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.4)">Kauai</h3>
         <p style="margin:4px 0 0;font:500 15px var(--font);color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.35)">Jul 4 – Jul 8 · 4 days</p>
       </div>
     </div>`;
  const chev = svg('chev', 22, '#fff', 2); chev.style.flexShrink='0'; chev.style.opacity='.95';
  c.querySelector('#ov').appendChild(chev);
  return c;
}
function eventCard() {
  const c = el('div','card'); Object.assign(c.style,{ width:'300px', borderRadius:'16px', overflow:'hidden', position:'relative' });
  c.innerHTML =
    `<div style="position:relative;height:118px;background:linear-gradient(135deg,#0891B2,#67E8F9)">
       <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&h=300&fit=crop&auto=format" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"/>
       <div style="position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to top,rgba(0,0,0,.5),transparent)"></div>
     </div>
     <div class="ebody" style="padding:12px 14px;display:flex;align-items:center;gap:10px">
       <div style="flex:1;min-width:0">
         <p style="font:600 18px var(--font);color:#1A1A1A">Poipu Beach Afternoon</p>
         <p style="margin-top:2px;font:500 16px var(--font);color:#6B6B6B">Snorkel + sunbathe</p>
       </div>
     </div>`;
  const badge = el('div'); Object.assign(badge.style,{ position:'absolute', top:'86px', left:'9px', display:'flex',
    alignItems:'center', gap:'6px', background:'rgba(0,0,0,.6)', padding:'4px 10px', borderRadius:'8px',
    color:'#fff', font:'600 12px var(--font)' });
  badge.appendChild(svg('beach', 14, '#fff', 2.5)); badge.append('Beach');
  c.appendChild(badge);
  const det = el('div'); Object.assign(det.style,{ height:'34px', padding:'0 10px 0 12px', borderRadius:'8px',
    background:'rgba(14,116,144,.12)', display:'inline-flex', alignItems:'center', gap:'4px',
    font:'600 14px var(--font)', color:'#0E7490', flexShrink:'0' });
  det.append('Details'); det.appendChild(svg('chev', 16, '#0E7490', 2.5));
  c.querySelector('.ebody').appendChild(det);
  return c;
}
function bufferCard() {
  const c = el('div'); Object.assign(c.style,{ width:'300px', borderRadius:'12px', background:'#F6F8FC',
    border:'1.5px dashed #B6C2D1', padding:'16px', display:'flex', flexDirection:'column', gap:'6px' });
  c.appendChild(el('span',null,'<span style="font:600 15px var(--font);color:#6B6B6B">11:15 AM – 12:00 PM</span>'));
  const row = el('div'); Object.assign(row.style,{display:'flex',alignItems:'center',gap:'8px'});
  row.appendChild(svg('clock', 18, '#A8A094', 2.5));
  row.appendChild(el('p',null,'<span style="font:600 16px var(--font);color:#1A1A1A">~45 min buffer</span>'));
  c.appendChild(row);
  c.appendChild(el('p',null,'<span style="font:500 15px var(--font);color:#6B6B6B">Deplane + baggage + rental car</span>'));
  return c;
}
/* checklist row in both states — same item, unchecked vs completed (product
   done-state: filled category color + white check + line-through, textLight) */
function checklistRow(done) {
  const r = el('div','card'); Object.assign(r.style,{ width:'320px', display:'flex', alignItems:'center',
    gap:'12px', borderRadius:'12px', padding:'12px 16px' });
  const box = el('div'); Object.assign(box.style,{ width:'22px', height:'22px', borderRadius:'6px', flexShrink:'0',
    border: done ? 'none' : '3px solid #0E749040', backgroundColor: done ? '#0E7490' : 'transparent',
    display:'flex', alignItems:'center', justifyContent:'center' });
  if (done) box.appendChild(svg('check', 13, '#fff', 3));
  r.appendChild(box);
  const t = el('span',null,'Pack sunscreen');
  Object.assign(t.style,{ flex:'1', font:'500 16px var(--font)', minWidth:'0',
    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
    color: done ? '#9B9B9B' : '#1A1A1A', textDecoration: done ? 'line-through' : 'none' });
  r.appendChild(t);
  const e1 = el('div'); Object.assign(e1.style,{ width:'40px', height:'40px', borderRadius:'10px',
    background:'rgba(0,0,0,.04)', display:'flex', alignItems:'center', justifyContent:'center' });
  e1.appendChild(svg('pencil', 14, '#9B9B9B', 2));
  const e2 = el('div'); Object.assign(e2.style,{ width:'40px', height:'40px', borderRadius:'10px',
    background:'#FDECEA', display:'flex', alignItems:'center', justifyContent:'center' });
  e2.appendChild(svg('trash', 14, '#C0392B', 2));
  r.append(e1, e2);
  return r;
}
/* day header on its Kauai island tint (v0.0.205 redesign: eyebrow + 24/700
   full-weekday date + route with arrow) */
function dayHeader() {
  const c = el('div'); Object.assign(c.style,{ width:'300px', borderRadius:'16px', background:'#F9F0E6',
    padding:'18px 16px', textAlign:'center', boxShadow:'0 6px 18px rgba(40,50,70,.12)' });
  c.appendChild(el('p',null,'<span style="font:600 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B">Day 1 of 9</span>'));
  const h = el('h2',null,'Saturday, July 4');
  Object.assign(h.style,{ margin:'4px 0 0', font:'700 24px/30px var(--font)', color:'#1A1A1A' });
  c.appendChild(h);
  const route = el('p'); Object.assign(route.style,{ margin:'4px 0 0', display:'inline-flex',
    alignItems:'center', gap:'6px', font:'500 15px var(--font)', color:'#6B6B6B' });
  route.append('Chicago'); route.appendChild(svg('arrow', 14, '#9B9B9B', 2.2)); route.append('Kauai');
  c.appendChild(route);
  return c;
}
function detailsCard() {
  const c = el('div','card'); Object.assign(c.style,{ width:'300px', borderRadius:'16px', padding:'0 24px' });
  const rows = [['Time','6:50 AM',false],['Duration','5h 20m',false],['Place','Lihue (LIH)',false],['Confirmation','UA1947',true]];
  rows.forEach(([k,v,mono],i)=>{
    const r = el('div'); Object.assign(r.style,{ display:'flex', alignItems:'baseline', justifyContent:'space-between',
      gap:'16px', padding:'12px 0', borderBottom: i===rows.length-1 ? 'none' : '1px solid #F0EFEA' });
    r.appendChild(el('span',null,`<span style="font:500 15px var(--font);color:#9B9B9B">${k}</span>`));
    r.appendChild(el('span',null,`<span style="font:600 15px var(--font);color:#1A1A1A;${mono?"font-family:'SF Mono','Fira Code',monospace;":''}">${v}</span>`));
    c.appendChild(r);
  });
  return c;
}

/* trip-at-a-glance stat tiles (CalendarView) ---------------------------------- */
function statTiles() {
  const row = el('div'); Object.assign(row.style,{ display:'flex', gap:'12px', width:'320px' });
  for (const [v, l] of [['9','Days'],['38','Events'],['2','Islands']]) {
    const t = el('div','card'); Object.assign(t.style,{ flex:'1', borderRadius:'16px', padding:'14px 8px', textAlign:'center' });
    t.appendChild(el('div',null,`<span style="font:700 24px/30px var(--font);color:#1A1A1A">${v}</span>`));
    t.appendChild(el('div',null,`<span style="font:500 15px var(--font);color:#6B6B6B">${l}</span>`));
    row.appendChild(t);
  }
  return row;
}
/* calendar day cells (DayCard variants: non-trip / Kauai selected / Kauai /
   Maui — island tints + shape dots: Kauai circle, Maui square) --------------- */
function calStrip() {
  const wrap = el('div','card'); Object.assign(wrap.style,{ width:'300px', borderRadius:'16px',
    padding:'10px', display:'flex', gap:'6px' });
  const CELLS = [
    { n:'3', bg:'rgba(237,234,229,.4)', w:400, color:'#6B6B6B' },
    { n:'4', bg:'#F9F0E6', w:700, color:'#1A1A1A', border:'2.5px solid #0E7490', dot:{c:'#DB8F43',round:true} },
    { n:'5', bg:'#F9F0E6', w:700, color:'#1A1A1A', dot:{c:'#DB8F43',round:true} },
    { n:'8', bg:'#E7F4F8', w:700, color:'#1A1A1A', dot:{c:'#2AA5CB',round:false} },
    { n:'9', bg:'#E7F4F8', w:700, color:'#1A1A1A', dot:{c:'#2AA5CB',round:false} },
  ];
  for (const cell of CELLS) {
    const c = el('div'); Object.assign(c.style,{ flex:'1', aspectRatio:'1/1', borderRadius:'8px',
      backgroundColor:cell.bg, border:cell.border||'none', position:'relative',
      display:'flex', alignItems:'center', justifyContent:'center',
      boxShadow:cell.bg==='rgba(237,234,229,.4)'?'none':'0 1px 3px rgba(0,0,0,.04)' });
    c.appendChild(el('span',null,`<span style="font:${cell.w} 18px/20px var(--font);color:${cell.color}">${cell.n}</span>`));
    if (cell.dot) {
      const d = el('div'); Object.assign(d.style,{ position:'absolute', bottom:'3px', right:'3px',
        width:'5px', height:'5px', borderRadius:cell.dot.round?'50%':'1px', backgroundColor:cell.dot.c, opacity:'.5' });
      c.appendChild(d);
    }
    wrap.appendChild(c);
  }
  return wrap;
}
/* checklist header (StatusView): title + Add pill + progress bar -------------- */
function progressCard() {
  const c = el('div','card'); Object.assign(c.style,{ width:'320px', borderRadius:'16px', padding:'16px' });
  const top = el('div'); Object.assign(top.style,{ display:'flex', alignItems:'center', justifyContent:'space-between' });
  top.appendChild(el('span',null,'<span style="font:600 18px var(--font);color:#1A1A1A">Checklist</span>'));
  const add = el('div'); Object.assign(add.style,{ height:'30px', padding:'0 14px', borderRadius:'9999px',
    background:'#0E7490', color:'#fff', display:'inline-flex', alignItems:'center', gap:'4px',
    font:'600 15px var(--font)', boxShadow:'0 2px 8px rgba(14,116,144,.25)' });
  add.appendChild(svg('plus', 14, '#fff', 2.5)); add.append('Add');
  top.appendChild(add); c.appendChild(top);
  const bar = el('div'); Object.assign(bar.style,{ display:'flex', alignItems:'center', gap:'12px', marginTop:'14px' });
  const track = el('div'); Object.assign(track.style,{ flex:'1', height:'6px', borderRadius:'3px',
    background:'rgba(14,116,144,.12)', overflow:'hidden' });
  const fill = el('div'); Object.assign(fill.style,{ width:'62.5%', height:'100%', borderRadius:'3px', background:'#0E7490' });
  track.appendChild(fill); bar.appendChild(track);
  bar.appendChild(el('span',null,'<span style="font:600 13px var(--font);color:#6B6B6B">5/8</span>'));
  c.appendChild(bar);
  return c;
}

/* assemble — 3 heavily staggered columns, reference-style loose grid ---------- */
const COLS = [
  { offset: -64, items: [destCard, detailsCard, statTiles] },
  { offset: 84,  items: [eventCard, calStrip, bufferCard] },
  { offset: -28, items: [dayHeader, progressCard, () => checklistRow(false), () => checklistRow(true)] },
];
const board = document.getElementById('board');
for (const col of COLS) {
  const c = el('div','bcol');
  c.style.transform = `translateY(${col.offset}px)`;
  for (const make of col.items) c.appendChild(make());
  board.appendChild(c);
}

window.__ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
