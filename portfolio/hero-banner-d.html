<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero Banner D — Split layout</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; background: transparent; }

  #panel {
    position: relative;
    width: 1440px; height: 640px;
    overflow: hidden;
    display: flex;
  }

  /* left: warm cream behind the phone */
  .left-bg {
    position: absolute; inset: 0;
    background: #F5EFE8;
  }
  /* right: rich teal block */
  .right-bg {
    position: absolute;
    left: 560px; top: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #0E7490 0%, #0A5C74 100%);
  }
  /* subtle dot grid on right */
  .right-grid {
    position: absolute;
    left: 560px; top: 0; right: 0; bottom: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,255,255,.10) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  /* diagonal slice between sections */
  .slice {
    position: absolute;
    left: 490px; top: 0; width: 140px; bottom: 0;
    background: #F5EFE8;
    clip-path: polygon(0 0, 60% 0, 100% 100%, 0 100%);
  }

  /* phone — left side, centered vertically */
  #phone-pos {
    position: absolute;
    left: 72px; top: 26px;
    z-index: 2;
  }
  #phone-scale { transform: scale(0.68); transform-origin: top left; }
  .phone-bezel {
    width: 410px; height: 864px;
    border-radius: 44px; background: #14181F; padding: 10px;
    box-shadow: 0 32px 80px rgba(20,28,40,.30), 0 8px 24px rgba(20,28,40,.16),
                inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .phone-screen {
    width: 390px; height: 844px; border-radius: 34px;
    background: url('screens/trip.png') center top / 390px 844px no-repeat, #14181F;
  }

  /* right: text content */
  .text-side {
    position: absolute;
    left: 660px; top: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 80px 0 60px;
    z-index: 2;
  }
  .eyebrow {
    font: 600 13px/16px var(--font);
    letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.65);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .eyebrow::before {
    content: ''; display: block;
    width: 20px; height: 2px;
    background: rgba(255,255,255,.5); border-radius: 1px;
  }
  .title {
    font: 700 52px/56px var(--font);
    color: #fff;
    letter-spacing: -.02em;
    margin-bottom: 16px;
  }
  .sub {
    font: 500 18px/26px var(--font);
    color: rgba(255,255,255,.70);
    margin-bottom: 36px;
  }
  .stats {
    display: flex; gap: 32px;
  }
  .stat-item { }
  .stat-num {
    font: 700 32px/36px var(--font);
    color: #fff;
  }
  .stat-label {
    font: 500 13px/18px var(--font);
    letter-spacing: .06em; text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-top: 2px;
  }
  .stat-div {
    width: 1px; background: rgba(255,255,255,.20);
    align-self: stretch; margin-top: 4px;
  }
</style>
</head>
<body>
<div id="panel">
  <div class="left-bg"></div>
  <div class="right-bg"></div>
  <div class="right-grid"></div>
  <div class="slice"></div>

  <!-- phone -->
  <div id="phone-pos"><div id="phone-scale">
    <div class="phone-bezel"><div class="phone-screen"></div></div>
  </div></div>

  <!-- text -->
  <div class="text-side">
    <div class="eyebrow">Hawaii · July 2026</div>
    <h1 class="title">Plan your trip,<br>hour by hour.</h1>
    <p class="sub">Multi-day itineraries, live packing<br>checklists, and real-time day planning.</p>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-num">9</div>
        <div class="stat-label">Days</div>
      </div>
      <div class="stat-div"></div>
      <div class="stat-item">
        <div class="stat-num">2</div>
        <div class="stat-label">Islands</div>
      </div>
      <div class="stat-div"></div>
      <div class="stat-item">
        <div class="stat-num">38</div>
        <div class="stat-label">Events</div>
      </div>
    </div>
  </div>
</div>

<script>
window.__ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
