    border: solid white;
    flex-shrink: 0;
  }
  .sticker::after {
    content: '';

    border-radius: inherit;
    background: linear-gradient(145deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.04) 45%, rgba(0,0,0,0.06) 100%);

const VIZ = {flight:'#438ADB',ground_transport:'#725ED4',hotel:'#A35CCC',activity:'#32AE70',dining:'#DB5743',buffer:'#A8A094',boat:'#2AA5CB',sunrise:'#DB8F43',sightseeing:'#D5B534',beach:'#29AEA0',hiking:'#38B242',shopping:'#DD4B94',entertainment:'#D256D2'};

function makeSticker(id, size, opacity, blur) {
  const br = Math.round(size * 0.29);
  const bw = Math.max(2, Math.round(size * 0.065));
  const iconSize = Math.round(size * 0.5);

  const wrap = document.createElement('div');
  wrap.className = 'sticker';
  Object.assign(wrap.style, {
    width: size + 'px', height: size + 'px',
    borderRadius: br + 'px',
    background: VIZ[id],
    borderWidth: bw + 'px',
    opacity: opacity,
    filter: blur ? `blur(${blur}px)` : 'none',
    boxShadow: blur ? 'none' : `0 ${Math.round(size*0.08)}px ${Math.round(size*0.22)}px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.14)`,
  });

  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('width', iconSize);
  s.setAttribute('height', iconSize);
  s.setAttribute('fill','none');
  s.setAttribute('stroke','#fff');
  s.setAttribute('stroke-width','2');
  s.setAttribute('stroke-linecap','round');
  s.setAttribute('stroke-linejoin','round');
  for (const [tag, attrs] of ICONS[id]) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    s.appendChild(el);
  }
  wrap.appendChild(s);
  return wrap;
}

function place(el, x, y, rot) {
  Object.assign(el.style, {
    left: x + 'px', top: y + 'px',
    transform: `rotate(${rot}deg)`,
  });
  document.getElementById('stage').appendChild(el);
}
