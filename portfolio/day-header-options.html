<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Day header — options</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --font: 'DM Sans', -apple-system, sans-serif; --ocean:#0E7490; --tint:#F9F0E6; --td:#1A1A1A; --tm:#6B6B6B; --tl:#9B9B9B; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; background: #F2F3F5; color: #1A1A1A; padding: 40px 24px 90px; }
  h1 { font-size: 25px; font-weight: 700; text-align: center; }
  .sub { text-align: center; font-size: 14px; font-weight: 500; color: #6B6B6B; margin: 6px auto 34px; max-width: 560px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 22px; max-width: 460px; margin: 0 auto; }
  .opt { }
  .olabel { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #9B9B9B; margin-bottom: 8px; }
  .onote { font-weight:500; text-transform:none; letter-spacing:0; color:#B5B5B5; }
  /* header bar mimic */
  .hdr { background: var(--tint); border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 10px;
         box-shadow: 0 4px 14px rgba(40,50,70,.06); }
  .nav { width: 40px; height: 40px; border-radius: 9px; background: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.5);
         display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .mid { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cap { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--tm); }
  .d18 { font-size: 18px; font-weight: 600; color: var(--td); }
  .d24 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; color: var(--td); }
  .route { font-size: 15px; font-weight: 500; color: var(--tm); display: inline-flex; align-items: center; gap: 6px; }
  .chip { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--ocean); padding: 3px 10px; border-radius: 9999px; }
  .dots { display: flex; gap: 5px; margin-top: 6px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.16); }
  .dot.past { background: var(--ocean); opacity: .4; }
  .dot.cur { width: 22px; border-radius: 4px; background: var(--ocean); }
  .bar { width: 150px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.12); margin-top: 8px; overflow: hidden; }
  .bar > i { display:block; height:100%; width:44%; background: var(--ocean); border-radius:3px; }
  .bignum { display:flex; align-items:baseline; gap:4px; }
  .bignum b { font-size: 30px; font-weight: 700; color: var(--ocean); line-height:1; letter-spacing:-.02em; }
  .bignum span { font-size: 13px; font-weight: 600; color: var(--tl); }
  svg { display:block; }
</style>
</head>
<body>
  <h1>Day header — options</h1>
  <p class="sub">Making "Day 4 of 9 · date · route" a real focal point instead of fine print. Each shown on the Kauai (Sunrise) tinted header.</p>
  <div class="options" id="options"></div>

<script>
const NS='http://www.w3.org/2000/svg';
function ico(d,size,color,sw){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',size);s.setAttribute('height',size);s.setAttribute('fill','none');s.setAttribute('stroke',color);s.setAttribute('stroke-width',sw||2);s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.innerHTML=d;return s;}
const CHEVL='<path d="m15 18-6-6 6-6"/>', CHEVR='<path d="m9 18 6-6-6-6"/>', ARROW='<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function nav(dir){const n=el('div','nav');n.appendChild(ico(dir==='l'?CHEVL:CHEVR,20,'#9B9B9B',2));return n;}
function route(){const r=el('span','route');r.append('Chicago');r.appendChild(ico(ARROW,13,'#9B9B9B',2.2));r.append('Kauai');return r;}
function dots(){const d=el('div','dots');for(let i=1;i<=9;i++){const x=el('div','dot'+(i<4?' past':i===4?' cur':''));d.appendChild(x);}return d;}

const OPTS = [
  { label:'Current <span class="onote">— easy to miss</span>', build:(mid)=>{
      mid.append(el('div','cap','Day 4 of 9'), el('div','d18','Sat, July 4'), el('div','route','Chicago to Kauai')); } },
  { label:'A · Big date + day chip', build:(mid)=>{
      mid.append(el('div','chip','DAY 4 / 9'), el('div','d24','Saturday, July 4')); mid.appendChild(route()); } },
  { label:'B · Trip-progress dots', build:(mid)=>{
      mid.append(el('div','d24','Saturday, July 4')); mid.appendChild(route()); mid.appendChild(dots()); } },
  { label:'C · Progress bar', build:(mid)=>{
      mid.append(el('div','cap','Day 4 of 9'), el('div','d24','Saturday, July 4')); mid.appendChild(route());
      const b=el('div','bar','<i></i>'); mid.appendChild(b); } },
  { label:'D · Big day number', build:(mid)=>{
      mid.style.flexDirection='row'; mid.style.gap='14px'; mid.style.textAlign='left'; mid.style.justifyContent='center';
      const n=el('div','bignum','<b>4</b><span>/ 9</span>');
      const col=el('div'); col.style.display='flex'; col.style.flexDirection='column'; col.style.gap='2px'; col.style.alignItems='flex-start';
      col.append(el('div','d24','Saturday, July 4')); col.appendChild(route());
      mid.append(n,col); } },
];
const root=document.getElementById('options');
for(const o of OPTS){
  const wrap=el('div','opt');
  wrap.appendChild(el('div','olabel',o.label));
  const hdr=el('div','hdr');
  const mid=el('div','mid');
  o.build(mid);
  hdr.append(nav('l'), mid, nav('r'));
  wrap.appendChild(hdr);
  root.appendChild(wrap);
}
</script>
</body>
</html>
